[package]
name = "content-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
comrak = "0.20"
tantivy = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
walkdir = "2.4"
regex = "1.10"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3.8"
