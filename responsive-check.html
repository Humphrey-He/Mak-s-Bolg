<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Check</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b1020; color: #e5eef7; }
    .wrap { display: grid; gap: 24px; padding: 24px; }
    .panel { background: #121933; border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 16px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    iframe { display: block; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; background: white; }
    .desktop { width: 1440px; height: 980px; transform: scale(0.5); transform-origin: top left; margin-bottom: -490px; }
    .mobile { width: 390px; height: 844px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h2>Desktop 1440px</h2>
      <iframe class="desktop" src="http://127.0.0.1:3010/"></iframe>
    </div>
    <div class="panel" style="width: 422px;">
      <h2>Mobile 390px</h2>
      <iframe class="mobile" src="http://127.0.0.1:3010/"></iframe>
    </div>
  </div>
</body>
</html>
